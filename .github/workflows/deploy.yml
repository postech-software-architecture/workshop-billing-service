name: publish-and-deploy
'on':
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publicar imagem sem implantar no EKS (primeira publicação)
        type: boolean
        default: false
        required: false
permissions:
  contents: read
  packages: write
concurrency:
  group: prod-billing-service
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - run: mvn -B -Pquality clean verify
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
        labels: 'org.opencontainers.image.source=https://github.com/${{ github.repository }}

          org.opencontainers.image.revision=${{ github.sha }}'
    - name: Verify anonymous registry access before deployment
      if: ${{ !inputs.publish_only }}
      env:
        IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      run: python3 scripts/check-public-image.py "$IMAGE"
    - name: Validate Academy session configuration
      env:
        ACCESS: ${{ secrets.AWS_ACCESS_KEY_ID }}
        SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        SESSION: ${{ secrets.AWS_SESSION_TOKEN }}
        CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
      run: test -n "$ACCESS" && test -n "$SECRET" && test -n "$SESSION" && test -n "$CLUSTER"
      if: ${{ !inputs.publish_only }}
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      if: ${{ !inputs.publish_only }}
    - run: aws sts get-caller-identity --query Account --output text
      if: ${{ !inputs.publish_only }}
    - uses: azure/setup-kubectl@v4
      if: ${{ !inputs.publish_only }}
    - name: Select cluster
      env:
        CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
      run: aws eks update-kubeconfig --name "$CLUSTER"
      if: ${{ !inputs.publish_only }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
      if: ${{ !inputs.publish_only }}
    - run: python -m pip install PyYAML==6.0.2
      if: ${{ !inputs.publish_only }}
    - name: Render Academy app
      env:
        RDS_HOST: ${{ vars.RDS_HOST }}
        PAYMENTS: ${{ vars.PAYMENTS_ENABLED || 'false' }}
        NOTIFICATIONS: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
        IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      run: python scripts/render-academy.py . --rds-host "$RDS_HOST" --image "$IMAGE" --output /tmp/app.yaml --payments "$PAYMENTS"
        --notifications "$NOTIFICATIONS"
      if: ${{ !inputs.publish_only }}
    - run: kubectl apply --dry-run=server -f /tmp/app.yaml
      if: ${{ !inputs.publish_only }}
    - run: kubectl apply -f /tmp/app.yaml
      if: ${{ !inputs.publish_only }}
    - name: Verify rollout
      id: rollout
      run: kubectl rollout status -n workshop deployment/billing-service --timeout=180s
      if: ${{ !inputs.publish_only }}
    - name: Roll back failed rollout
      if: ${{ !inputs.publish_only && failure() && steps.rollout.outcome == 'failure' }}
      run: kubectl rollout undo -n workshop deployment/billing-service
